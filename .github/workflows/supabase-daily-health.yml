name: Supabase Daily Health Check
on:
  schedule:
    - cron: '17 7 * * *' # Daily around 12:47 PM IST; GitHub may delay scheduled runs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify database activity on both projects
        shell: bash
        env:
          MR_OS_KEY: sb_publishable_zgHxLM-sL0-hF8BKFDrw-A_A3pPAS_-
          SNT_KEY: sb_publishable_nbPPdoNse5zY7_pr7HFxQQ_7jBaoKO0
        run: |
          set -Eeuo pipefail
          failed=0
          ping() {
            local label="$1" ref="$2" key="$3"
            echo "Checking $label ($ref)..."
            if curl --fail --show-error --silent --retry 2 --retry-delay 5 \
              --connect-timeout 10 --max-time 30 \
              -H "apikey: $key" \
              -H "Accept: application/json" \
              "https://$ref.supabase.co/rest/v1/healthcheck_ping?select=id&limit=1" \
              | grep -q '"id":1'; then
              echo "PASS: $label database query succeeded"
            else
              echo "::error::FAIL: $label database query failed or returned no heartbeat row"
              failed=1
            fi
          }
          ping "MR OS" "vapkcgxyznykskfyjyvq" "$MR_OS_KEY"
          ping "SNT Project" "sfrfjznzlrkofjddfzfh" "$SNT_KEY"
          exit "$failed"
